<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04060d" />
    <title>אין חיבור · אור הכוכבים של גפן</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #04060d;
        color: #f7f1e3;
        font-family: 'Heebo', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .star { font-size: 56px; color: #e8b64c; }
      h1 { font-size: 28px; margin: 16px 0 8px; }
      p { margin: 6px 0; color: rgba(247, 241, 227, 0.75); line-height: 1.6; }
      .en { direction: ltr; font-size: 14px; color: rgba(247, 241, 227, 0.55); }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: #e8b64c;
        color: #04060d;
        font: inherit;
        font-weight: 700;
        padding: 12px 28px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="star" aria-hidden="true">✦</div>
      <h1>אין חיבור לאינטרנט</h1>
      <p>לא הצלחנו לטעון את העמוד. בדקו את החיבור ונסו שוב.</p>
      <p class="en">No internet connection — please check your connection and try again.</p>
      <button type="button" onclick="location.reload()">לנסות שוב · Try again</button>
    </main>
  </body>
</html>
